# Drafts a categorized changelog as PRs merge, and labels PRs from their
# conventional-commit prefix (autolabeler) so the categories stay accurate.
#
# The draft is changelog preparation only: it is never published
# automatically. Publishing a release (wheels to PyPI, platform packages to
# npm) remains a deliberate maintainer action from a tagged commit.
name-template: v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION
version-resolver:
  minor:
    labels:
      - feat
  patch:
    labels:
      - fix
      - perf
      - docs
      - chore
      - ci
      - build
      - refactor
      - test
      - dependencies
      - security
  default: patch
categories:
  - title: Features
    when:
      labels:
        - feat
  - title: Bug Fixes
    when:
      labels:
        - fix
  - title: Performance
    when:
      labels:
        - perf
  - title: Security
    when:
      labels:
        - security
  - title: Documentation
    when:
      labels:
        - docs
        - documentation
  - title: Dependencies
    when:
      labels:
        - dependencies
  - title: CI & Maintenance
    when:
      labels:
        - ci
        - chore
        - build
        - test
        - refactor
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'
template: |
  ## What's Changed

  $CHANGES

  ## New Contributors

  $NEW_CONTRIBUTORS

  **Full Changelog**: https://github.com/thyn-ai/mojo-kernels/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
autolabeler:
  - label: feat
    title:
      - '/^feat(\(.+\))?!?:/'
  - label: fix
    title:
      - '/^fix(\(.+\))?!?:/'
  - label: perf
    title:
      - '/^perf(\(.+\))?!?:/'
  - label: docs
    title:
      - '/^docs(\(.+\))?!?:/'
  - label: ci
    title:
      - '/^ci(\(.+\))?!?:/'
  - label: chore
    title:
      - '/^chore(\(.+\))?!?:/'
  - label: build
    title:
      - '/^build(\(.+\))?!?:/'
  - label: test
    title:
      - '/^test(\(.+\))?!?:/'
  - label: refactor
    title:
      - '/^refactor(\(.+\))?!?:/'
  - label: security
    title:
      - '/^(fix|chore)\(security\)!?:/'
      - '/^security(\(.+\))?!?:/'
