name: ci-minisearch_fuzzy

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

jobs:
  test:
    name: minisearch-mojo differential tests + npm packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        shell: bash
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Build the MiniSearch fuzzy/BM25 Mojo kernel
        # The script creates kernels/minisearch_fuzzy/build/ before invoking
        # `mojo build`; the compiler does not create output directories.
        run: pixi run bash kernels/minisearch_fuzzy/build.sh

      - name: Differential + unit suite (native backend, then forced fallback)
        shell: bash
        run: bash typescript/minisearch_fuzzy_mojo/scripts/test_all.sh

      - name: Pack + repair the platform package (delocate/patchelf)
        # delocate (macOS) and patchelf (Linux) come from the pixi environment.
        run: pixi run bash typescript/minisearch_fuzzy_mojo/scripts/pack-platform.sh

      - name: End-user smoke (fresh npm project; native + simulated-Windows fallback)
        shell: bash
        env:
          MINISEARCH_MOJO_DIST: typescript/minisearch_fuzzy_mojo/dist
        run: |
          set -e
          # Hide the pixi env for the smoke: an end user has no Mojo toolchain,
          # so the platform package must load its kernel purely from its own
          # vendored libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          bash typescript/minisearch_fuzzy_mojo/scripts/smoke.sh

      - name: Upload npm tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minisearch-mojo-npm-${{ matrix.os }}
          path: typescript/minisearch_fuzzy_mojo/dist/*.tgz
          retention-days: 14
