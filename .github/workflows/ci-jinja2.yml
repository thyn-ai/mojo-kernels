name: ci-jinja2

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

jobs:
  test:
    name: jinja2-mojo differential tests + wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # Install the pixi binary only. The tasks below install the environment
          # lazily on first `pixi run`, exactly as the previous curl|bash step did;
          # `pixi install --locked` + caching is a separate, opt-in change.
          run-install: false

      - name: Build the jinja2 Mojo kernel
        run: pixi run bash kernels/jinja2/build.sh

      - name: Differential suite (native backend, then forced fallback)
        # The jinja2 oracle (jinja2==3.1.6) is provisioned by the script into
        # .oracle-jinja2/ (pip --target, not committed): the repo pixi manifest
        # is shared across kernels and stays untouched.
        shell: bash
        run: |
          export PYTHONNOUSERSITE=1
          pixi run bash scripts/test_all_jinja2.sh

      - name: Build + repair the platform wheel (delocate/auditwheel)
        run: pixi run bash python/jinja2_mojo/build_wheel.sh

      - name: Smoke-test the wheel in a clean venv
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/jinja2-wheel-smoke
          /tmp/jinja2-wheel-smoke/bin/pip install --quiet python/jinja2_mojo/dist/*.whl
          # Hide the pixi env for the smoke: an end user has no Mojo toolchain,
          # so the wheel must load its kernel purely from its own vendored
          # libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          cd /tmp
          /tmp/jinja2-wheel-smoke/bin/python -m jinja2_mojo | tee /tmp/qs-native.txt
          JINJA2_MOJO_DISABLE_NATIVE=1 /tmp/jinja2-wheel-smoke/bin/python -m jinja2_mojo | tee /tmp/qs-fallback.txt
          /tmp/jinja2-wheel-smoke/bin/python - <<'EOF'
          import jinja2_mojo

          info = jinja2_mojo.backend_info()
          assert info["native_available"], f"wheel must carry the native kernel: {info}"

          def checksum(path):
              for line in open(path):
                  if line.startswith("checksum: "):
                      return int(line.split(":")[1])
              raise AssertionError(f"no checksum in {path}")

          assert checksum("/tmp/qs-native.txt") == checksum("/tmp/qs-fallback.txt")
          print("wheel smoke OK:", jinja2_mojo.__version__, info["native_source"])
          EOF

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jinja2-mojo-wheel-${{ matrix.os }}
          path: python/jinja2_mojo/dist/*.whl
          retention-days: 14
