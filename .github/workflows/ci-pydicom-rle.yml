name: ci-pydicom-rle

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

# One run per ref; a newer push to a pull request cancels the run it supersedes.
# Pushes to main always run to completion.
concurrency:
  group: ci-pydicom-rle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pydicom-rle-mojo differential tests + wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # Install the pixi binary only. The tasks below install the environment
          # lazily on first `pixi run`, exactly as the previous curl|bash step did;
          # `pixi install --locked` + caching is a separate, opt-in change.
          run-install: false

      - name: Build the pydicom-rle Mojo kernel
        run: pixi run bash kernels/pydicom-rle/build.sh

      - name: Provision the pydicom oracle (hash-verified)
        # The oracle is the published PyPI release pydicom==3.0.2. Per-kernel
        # paths in this repository are disjoint and pixi.toml is off-limits,
        # so the oracle does not come from the pixi lockfile like the other
        # kernels' oracles; it is installed into a dedicated venv with its
        # wheel hash verified instead. pydicom is pure Python with zero
        # dependencies, so one hash covers every platform. numpy + pytest are
        # test tooling (the repository's shared tests/conftest.py imports
        # numpy), pinned exact.
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/pydicom-oracle
          printf '%s\n' \
            'pydicom==3.0.2 --hash=sha256:abf971a5440f84dbaf42c4b6758e30e62480902584f8b270b9a5d146e278a07b' \
            > /tmp/pydicom-oracle-reqs.txt
          /tmp/pydicom-oracle/bin/pip install --quiet --require-hashes \
            -r /tmp/pydicom-oracle-reqs.txt
          /tmp/pydicom-oracle/bin/pip install --quiet "numpy==2.5.3" "pytest==9.1.1"

      - name: Differential suite (native backend, then forced fallback)
        run: |
          PATH="/tmp/pydicom-oracle/bin:$PATH" PYTHONPATH=python/pydicom_mojo PYTHONNOUSERSITE=1 \
            bash scripts/test_all_pydicom_rle.sh

      - name: Build + repair the platform wheel (delocate/auditwheel)
        run: pixi run bash python/pydicom_mojo/build_wheel.sh

      - name: Smoke-test the wheel in a clean venv
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/pydicom-rle-wheel-smoke
          /tmp/pydicom-rle-wheel-smoke/bin/pip install --quiet python/pydicom_mojo/dist/*.whl
          # Hide the pixi env for the smoke: an end user has no Mojo toolchain,
          # so the wheel must load its kernel purely from its own vendored
          # libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          cd /tmp
          # quickstart lives under examples/ so its directory contains no
          # pydicom_mojo/ package: sys.path[0] cannot shadow the installed wheel.
          /tmp/pydicom-rle-wheel-smoke/bin/python "$repo_root/python/pydicom_mojo/examples/quickstart.py" | tee /tmp/quickstart-native.txt
          # The forced fallback must produce identical output.
          PYDICOM_MOJO_DISABLE_NATIVE=1 /tmp/pydicom-rle-wheel-smoke/bin/python "$repo_root/python/pydicom_mojo/examples/quickstart.py" | tee /tmp/quickstart-fallback.txt
          /tmp/pydicom-rle-wheel-smoke/bin/python - <<'EOF'
          import pydicom_mojo

          info = pydicom_mojo.backend_info()
          assert info["native_available"], f"wheel must carry the native kernel: {info}"

          native = open("/tmp/quickstart-native.txt").read()
          fallback = open("/tmp/quickstart-fallback.txt").read()
          strip = lambda t: "\n".join(l for l in t.splitlines() if not l.startswith("pydicom-mojo"))
          assert strip(native) == strip(fallback), (native, fallback)
          print("wheel smoke OK:", pydicom_mojo.__version__, info["native_source"])
          EOF

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pydicom-rle-mojo-wheel-${{ matrix.os }}
          path: python/pydicom_mojo/dist/*.whl
          retention-days: 14
