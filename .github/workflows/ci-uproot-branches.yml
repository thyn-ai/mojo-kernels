name: ci-uproot-branches

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

jobs:
  test:
    name: uproot-mojo differential tests + wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # Install the pixi binary only. The tasks below install the environment
          # lazily on first `pixi run`, exactly as the previous curl|bash step did;
          # `pixi install --locked` + caching is a separate, opt-in change.
          run-install: false

      - name: Build the uproot-branches Mojo kernel
        run: pixi run bash kernels/uproot-branches/build.sh

      - name: Install oracle deps (uproot/awkward) into the pixi env
        # The repo pixi manifest is shared; these test-oracle packages are
        # installed per-leg instead (pinned, matching the README benchmark).
        run: pixi run python -m pip install "uproot==5.7.6" "awkward==2.14.0" "cramjam==2.12.1"

      - name: Differential suite (native backend, then forced fallback)
        run: pixi run bash scripts/test_all_uproot-branches.sh

      - name: Build + repair the platform wheel (delocate/auditwheel)
        run: pixi run bash python/uproot-branches_mojo/build_wheel.sh

      - name: Smoke-test the wheel in a clean venv
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/uproot-wheel-smoke
          /tmp/uproot-wheel-smoke/bin/pip install --quiet python/uproot-branches_mojo/dist/*.whl uproot awkward
          # Hide the pixi env for the smoke: an end user has no Mojo toolchain,
          # so the wheel must load its kernel purely from its own vendored
          # libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          # Copy the quickstart out of the source tree: running it in place
          # would put the source package on sys.path[0] and shadow the wheel.
          cp python/uproot-branches_mojo/quickstart.py /tmp/uproot-branches-quickstart.py
          cd /tmp
          /tmp/uproot-wheel-smoke/bin/python /tmp/uproot-branches-quickstart.py | tee /tmp/quickstart-native.txt
          # The forced fallback must produce the same checksum.
          UPROOT_MOJO_DISABLE_NATIVE=1 /tmp/uproot-wheel-smoke/bin/python /tmp/uproot-branches-quickstart.py | tee /tmp/quickstart-fallback.txt
          /tmp/uproot-wheel-smoke/bin/python - <<'EOF'
          import re

          import uproot_mojo

          info = uproot_mojo.backend_info()
          assert info["native_available"], f"wheel must carry the native kernel: {info}"
          assert "bundled in wheel" in info["native_source"], info["native_source"]

          def checksum(path):
              text = open(path).read()
              m = re.search(r"branch checksum: ([0-9.eE+-]+)", text)
              assert m, f"no checksum in {path}"
              return float(m.group(1))

          native = checksum("/tmp/quickstart-native.txt")
          fallback = checksum("/tmp/quickstart-fallback.txt")
          assert native == fallback, (native, fallback)
          print("wheel smoke OK:", uproot_mojo.__version__, info["native_source"])
          EOF

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uproot-mojo-wheel-${{ matrix.os }}
          path: python/uproot-branches_mojo/dist/*.whl
          retention-days: 14
