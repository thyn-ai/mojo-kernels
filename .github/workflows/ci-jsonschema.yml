name: ci-jsonschema

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

jobs:
  test:
    name: jsonschema-mojo differential tests + wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # Install the pixi binary only. The tasks below install the environment
          # lazily on first `pixi run`, exactly as the previous curl|bash step did;
          # `pixi install --locked` + caching is a separate, opt-in change.
          run-install: false

      - name: Install the oracle (pip, not pixi.toml)
        run: |
          pixi run python -m ensurepip || true
          pixi run python -m pip install --quiet "jsonschema==4.26.0"

      - name: Build the jsonschema Mojo kernel
        run: pixi run bash kernels/jsonschema/build.sh

      - name: Differential suite (native backend, then forced fallback)
        run: pixi run bash scripts/test_all_jsonschema.sh

      - name: Build + repair the platform wheel (delocate/auditwheel)
        run: pixi run bash python/jsonschema_mojo/build_wheel.sh

      - name: Smoke-test the wheel in a clean venv
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/jsonschema-wheel-smoke
          /tmp/jsonschema-wheel-smoke/bin/pip install --quiet python/jsonschema_mojo/dist/*.whl
          # Hide the pixi env for the smoke: an end user has no Mojo
          # toolchain, so the wheel must load its kernel purely from its own
          # vendored libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          cd /tmp
          /tmp/jsonschema-wheel-smoke/bin/python "$repo_root/python/jsonschema_mojo/examples/quickstart.py" | tee /tmp/quickstart-native.txt
          # The forced fallback must produce the same results (the only
          # intentional difference is the reported backend name).
          JSONSCHEMA_MOJO_DISABLE_NATIVE=1 /tmp/jsonschema-wheel-smoke/bin/python "$repo_root/python/jsonschema_mojo/examples/quickstart.py" | tee /tmp/quickstart-fallback.txt
          diff <(grep -v '^backend: ' /tmp/quickstart-native.txt) <(grep -v '^backend: ' /tmp/quickstart-fallback.txt)
          /tmp/jsonschema-wheel-smoke/bin/python - <<'EOF'
          import jsonschema_mojo

          info = jsonschema_mojo.backend_info()
          assert info["native_available"], f"wheel must carry the native kernel: {info}"
          print("wheel smoke OK:", jsonschema_mojo.__version__, info["native_source"])
          EOF

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jsonschema-mojo-wheel-${{ matrix.os }}
          path: python/jsonschema_mojo/dist/*.whl
          retention-days: 14
