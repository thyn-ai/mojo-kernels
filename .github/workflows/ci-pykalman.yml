name: ci-pykalman

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

jobs:
  test:
    name: pykalman-mojo differential tests + wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        shell: bash
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install the pykalman oracle (test reference only)
        # The oracle is a pip-only test dependency (pixi.toml is shared and
        # not edited per-kernel); the published wrapper never depends on it.
        run: pixi run python -m pip install pykalman==0.11.2

      - name: Build the pykalman Mojo kernel
        run: pixi run bash kernels/pykalman/build.sh

      - name: Differential suite (native backend, then forced fallback)
        run: pixi run bash scripts/test_all_pykalman.sh
        env:
          PYTHONPATH: python/pykalman_mojo
          PYTHONNOUSERSITE: "1"

      - name: Build + repair the platform wheel (delocate/auditwheel)
        run: pixi run bash python/pykalman_mojo/build_wheel.sh
        env:
          PYTHONNOUSERSITE: "1"

      - name: Smoke-test the wheel in a clean venv
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/pykalman-wheel-smoke
          /tmp/pykalman-wheel-smoke/bin/pip install --quiet python/pykalman_mojo/dist/*.whl
          # Hide the pixi env for the smoke: an end user has no Mojo
          # toolchain, so the wheel must load its kernel purely from its own
          # vendored libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          cd /tmp
          cat > /tmp/pykalman_quickstart.py <<'EOF'
          import numpy as np
          import pykalman_mojo
          from pykalman_mojo import KalmanFilter

          kf = KalmanFilter(
              transition_matrices=[[1.0, 0.1], [0.0, 1.0]],
              observation_matrices=[[1.0, 0.0]],
              transition_covariance=[[0.03, 0.0], [0.0, 0.03]],
              observation_covariance=[[0.5]],
          )
          rng = np.random.RandomState(0)
          obs = np.cumsum(rng.randn(200, 1), axis=0) + rng.randn(200, 1) * 0.5
          fm, fc = kf.filter(obs)
          sm, sc = kf.smooth(obs)
          m = np.zeros_like(obs, dtype=bool); m[50:60] = True
          fm2, _ = kf.filter(np.ma.masked_array(obs, mask=m))
          print("backend:", kf.backend)
          print("filter checksum:", float(np.sum(fm) + np.sum(fc)))
          print("smooth checksum:", float(np.sum(sm) + np.sum(sc)))
          print("masked checksum:", float(np.sum(fm2)))
          EOF
          /tmp/pykalman-wheel-smoke/bin/python /tmp/pykalman_quickstart.py | tee /tmp/quickstart-native.txt
          # The forced fallback must produce the same results (documented
          # 1e-10 tolerance; identical to all printed digits here).
          PYKALMAN_MOJO_DISABLE_NATIVE=1 /tmp/pykalman-wheel-smoke/bin/python /tmp/pykalman_quickstart.py | tee /tmp/quickstart-fallback.txt
          /tmp/pykalman-wheel-smoke/bin/python - <<'EOF'
          import re

          import pykalman_mojo

          info = pykalman_mojo.backend_info()
          assert info["native_available"], f"wheel must carry the native kernel: {info}"

          def checksums(path):
              text = open(path).read()
              return [
                  float(re.search(rf"{name} checksum: ([0-9.eE+-]+)", text).group(1))
                  for name in ("filter", "smooth", "masked")
              ]

          native = checksums("/tmp/quickstart-native.txt")
          fallback = checksums("/tmp/quickstart-fallback.txt")
          for n, f in zip(native, fallback):
              assert abs(n - f) <= 1e-9 * max(1.0, abs(n)), (native, fallback)
          print("wheel smoke OK:", pykalman_mojo.__version__, info["native_source"])
          EOF

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pykalman-mojo-wheel-${{ matrix.os }}
          path: python/pykalman_mojo/dist/*.whl
          retention-days: 14
