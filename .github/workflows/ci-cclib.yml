name: ci-cclib

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

# One run per ref; a newer push to a pull request cancels the run it supersedes.
# Pushes to main always run to completion.
concurrency:
  group: ci-cclib-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: cclib-mojo differential tests + wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # Install the pixi binary only. The tasks below install the environment
          # lazily on first `pixi run`, exactly as the previous curl|bash step did;
          # `pixi install --locked` + caching is a separate, opt-in change.
          run-install: false

      - name: Build the gaussgrid Mojo kernel
        run: pixi run build-kernel-gaussgrid

      - name: Differential suite (native backend, then forced fallback)
        run: pixi run test-cclib

      - name: Build + repair the platform wheel (delocate/auditwheel)
        run: pixi run wheel-cclib

      - name: Smoke-test the wheel in a clean venv
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/cclib-wheel-smoke
          /tmp/cclib-wheel-smoke/bin/pip install --quiet python/cclib_mojo/dist/*.whl
          # Hide the pixi env for the smoke: an end user has no Mojo toolchain,
          # so the wheel must load its kernel purely from its own vendored
          # libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          cd /tmp
          # quickstart.py lives at the repo root so its directory contains no
          # cclib_mojo/ package: sys.path[0] cannot shadow the installed wheel.
          /tmp/cclib-wheel-smoke/bin/python "$repo_root/quickstart.py" | tee /tmp/quickstart-native.txt
          # The forced fallback must produce the same results (documented
          # 1e-10 tolerance; identical to all printed digits here).
          CCLIB_MOJO_DISABLE_NATIVE=1 /tmp/cclib-wheel-smoke/bin/python "$repo_root/quickstart.py" | tee /tmp/quickstart-fallback.txt
          /tmp/cclib-wheel-smoke/bin/python - <<'EOF'
          import re

          import cclib_mojo

          info = cclib_mojo.backend_info()
          assert info["native_available"], f"wheel must carry the native kernel: {info}"

          def checksum(path):
              text = open(path).read()
              m = re.search(r"density checksum: ([0-9.eE+-]+)", text)
              assert m, f"no checksum in {path}"
              return float(m.group(1))

          native = checksum("/tmp/quickstart-native.txt")
          fallback = checksum("/tmp/quickstart-fallback.txt")
          assert abs(native - fallback) <= 1e-9 * abs(native), (native, fallback)
          print("wheel smoke OK:", cclib_mojo.__version__, info["native_source"])
          EOF

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cclib-mojo-wheel-${{ matrix.os }}
          path: python/cclib_mojo/dist/*.whl
          retention-days: 14
