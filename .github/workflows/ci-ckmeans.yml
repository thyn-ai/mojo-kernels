name: ci-ckmeans

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

jobs:
  test:
    name: ckmeans-mojo differential tests + npm packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          # Install the pixi binary only. The tasks below install the environment
          # lazily on first `pixi run`, exactly as the previous curl|bash step did;
          # `pixi install --locked` + caching is a separate, opt-in change.
          run-install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Build the Ckmeans.1d.dp Mojo kernel
        run: pixi run bash kernels/ckmeans/build.sh

      - name: Differential suite (native backend, then forced fallback)
        run: bash typescript/ckmeans-mojo/scripts/test_all.sh

      - name: Pack + repair the platform package (delocate/patchelf)
        run: pixi run bash typescript/ckmeans-mojo/scripts/pack-platform.sh

      - name: End-user smoke (fresh npm project; native + simulated-Windows fallback)
        shell: bash
        env:
          CKMEANS_MOJO_DIST: typescript/ckmeans-mojo/dist
        run: |
          set -e
          # Hide the pixi env for the smoke: an end user has no Mojo toolchain,
          # so the platform package must load its kernel purely from its own
          # vendored libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          bash typescript/ckmeans-mojo/scripts/smoke.sh

      - name: Upload npm tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ckmeans-mojo-npm-${{ matrix.os }}
          path: typescript/ckmeans-mojo/dist/*.tgz
          retention-days: 14
