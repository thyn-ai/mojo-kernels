name: ci-natural

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

jobs:
  test:
    name: natural-mojo differential tests + npm packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        shell: bash
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the natural-distance Mojo kernel
        run: pixi run bash kernels/natural/build.sh

      - name: Differential suite (native backend, then forced fallback)
        run: bash typescript/natural-mojo/scripts/test_all.sh

      - name: Pack + repair the platform package (delocate/patchelf)
        run: pixi run bash typescript/natural-mojo/scripts/pack-platform.sh

      - name: End-user smoke (fresh npm project; native + simulated-Windows fallback)
        shell: bash
        env:
          NATURAL_MOJO_DIST: typescript/natural-mojo/dist
        run: |
          set -e
          # Hide the pixi env for the smoke: an end user has no Mojo toolchain,
          # so the platform package must load its kernel purely from its own
          # vendored libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          bash typescript/natural-mojo/scripts/smoke.sh

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: natural-mojo-npm-${{ matrix.os }}
          path: typescript/natural-mojo/dist/*.tgz
          retention-days: 14
