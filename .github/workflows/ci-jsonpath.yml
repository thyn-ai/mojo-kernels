name: ci-jsonpath

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

jobs:
  test:
    name: jsonpath-mojo differential tests + wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        shell: bash
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Build the jsonpath Mojo kernel
        run: pixi run bash kernels/jsonpath/build.sh

      - name: Bootstrap the oracle (jsonpath_ng is intentionally not in pixi.toml)
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --python .pixi/envs/default/bin/python --target /tmp/jporacle-lib "jsonpath_ng==1.7.0"

      - name: Differential suite (native backend, then forced fallback)
        run: pixi run bash scripts/test_all_jsonpath.sh

      - name: Build + repair the platform wheel (delocate/auditwheel)
        run: pixi run bash python/jsonpath_mojo/build_wheel.sh

      - name: Smoke-test the wheel in a clean venv
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/jp-wheel-smoke
          /tmp/jp-wheel-smoke/bin/pip install --quiet python/jsonpath_mojo/dist/*.whl
          # Hide the pixi env for the smoke: an end user has no Mojo toolchain,
          # so the wheel must load its kernel purely from its own vendored
          # libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          cd /tmp
          /tmp/jp-wheel-smoke/bin/python - <<'EOF'
          import os

          import jsonpath_mojo

          info = jsonpath_mojo.backend_info()
          assert info["native_available"], f"wheel must carry the native kernel: {info}"

          data = {
              "store": {
                  "book": [
                      {"title": "Sayings", "price": 8.95},
                      {"title": "Sword", "price": 12.99},
                      {"title": "Moby Dick", "price": 8.99, "isbn": "0-553"},
                  ],
                  "bicycle": {"color": "red", "price": 19.95},
              },
              "expensive": 10,
          }

          native = jsonpath_mojo.find("$.store.book[?(@.price < 10)].title", data)
          assert native == [
              ("Sayings", "store.book.[0].title"),
              ("Moby Dick", "store.book.[2].title"),
          ], native

          # The forced fallback must produce identical results.
          os.environ["JSONPATH_MOJO_DISABLE_NATIVE"] = "1"
          fallback = jsonpath_mojo.find("$.store.book[?(@.price < 10)].title", data)
          assert fallback == native, (native, fallback)

          # A recursive-descent + slice + wildcard quickstart for good measure.
          both = jsonpath_mojo.find("$..book[::-1].title", data)
          assert both == [
              ("Moby Dick", "store.book.[2].title"),
              ("Sword", "store.book.[1].title"),
              ("Sayings", "store.book.[0].title"),
          ], both
          print("wheel smoke OK:", jsonpath_mojo.__version__, info["native_source"])
          EOF

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jsonpath-mojo-wheel-${{ matrix.os }}
          path: python/jsonpath_mojo/dist/*.whl
          retention-days: 14
