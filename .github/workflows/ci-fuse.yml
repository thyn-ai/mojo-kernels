name: ci-fuse

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

# One run per ref; a newer push to a pull request cancels the run it supersedes.
# Pushes to main always run to completion.
concurrency:
  group: ci-fuse-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: fuse-mojo differential tests + npm packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          # Install the pixi binary only. The tasks below install the environment
          # lazily on first `pixi run`, exactly as the previous curl|bash step did;
          # `pixi install --locked` + caching is a separate, opt-in change.
          run-install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Build the Fuse Bitap Mojo kernel + pthread shim
        run: pixi run build-kernel-fuse

      - name: Differential suite (native backend, then forced fallback)
        run: pixi run test-fuse

      - name: Pack + repair the platform package (delocate/patchelf)
        run: pixi run pack-fuse

      - name: End-user smoke (fresh npm project; native + simulated-Windows fallback)
        shell: bash
        env:
          FUSE_MOJO_DIST: typescript/fuse-mojo/dist
        run: |
          set -e
          # Hide the pixi env for the smoke: an end user has no Mojo toolchain,
          # so the platform package must load its kernel purely from its own
          # vendored libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          bash typescript/fuse-mojo/scripts/smoke.sh

      - name: Upload npm tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuse-mojo-npm-${{ matrix.os }}
          path: typescript/fuse-mojo/dist/*.tgz
          retention-days: 14
