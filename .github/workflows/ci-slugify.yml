name: ci-slugify

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

jobs:
  test:
    name: slugify-mojo differential tests + wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # Install the pixi binary only. The tasks below install the environment
          # lazily on first `pixi run`, exactly as the previous curl|bash step did;
          # `pixi install --locked` + caching is a separate, opt-in change.
          run-install: false

      - name: Build the slugify Mojo kernel
        run: pixi run bash kernels/slugify/build.sh

      - name: Differential suite (native backend, then forced fallback)
        # The runner script provisions the PyPI oracle (python-slugify==9.1.0)
        # itself, in the pixi env when possible else in a dedicated venv.
        run: pixi run bash scripts/test_all_slugify.sh

      - name: Build + repair the platform wheel (delocate/auditwheel)
        run: pixi run bash python/slugify_mojo/build_wheel.sh

      - name: Smoke-test the wheel in a clean venv
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/slugify-wheel-smoke
          /tmp/slugify-wheel-smoke/bin/pip install --quiet python/slugify_mojo/dist/*.whl
          # Hide the pixi env for the smoke: an end user has no Mojo toolchain,
          # so the wheel must load its kernel purely from its own vendored
          # libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          cd /tmp
          # quickstart.py lives inside the package directory but un-shadows
          # the installed wheel itself (it pops sys.path[0] when it points at
          # the source tree).
          /tmp/slugify-wheel-smoke/bin/python "$repo_root/python/slugify_mojo/quickstart.py" | tee /tmp/quickstart-native.txt
          # The forced fallback must produce the same results (the suite
          # asserts byte-exact parity; identical checksum here).
          SLUGIFY_MOJO_DISABLE_NATIVE=1 /tmp/slugify-wheel-smoke/bin/python "$repo_root/python/slugify_mojo/quickstart.py" | tee /tmp/quickstart-fallback.txt
          /tmp/slugify-wheel-smoke/bin/python - <<'EOF'
          import re

          import slugify_mojo

          info = slugify_mojo.backend_info()
          assert info["native_available"], f"wheel must carry the native kernel: {info}"

          def checksum(path):
              text = open(path).read()
              m = re.search(r"slug checksum: ([0-9a-f]{64})", text)
              assert m, f"no checksum in {path}"
              return m.group(1)

          native = checksum("/tmp/quickstart-native.txt")
          fallback = checksum("/tmp/quickstart-fallback.txt")
          assert native == fallback, (native, fallback)
          print("wheel smoke OK:", slugify_mojo.__version__, info["native_source"])
          EOF

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slugify-mojo-wheel-${{ matrix.os }}
          path: python/slugify_mojo/dist/*.whl
          retention-days: 14
