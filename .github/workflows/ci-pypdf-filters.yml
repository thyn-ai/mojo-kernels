name: ci-pypdf-filters

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

jobs:
  test:
    name: pypdf-filters-mojo differential tests + wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # Install the pixi binary only. The tasks below install the environment
          # lazily on first `pixi run`, exactly as the previous curl|bash step did;
          # `pixi install --locked` + caching is a separate, opt-in change.
          run-install: false

      - name: Build the pypdf-filters Mojo kernel
        run: pixi run bash kernels/pypdf-filters/build.sh

      - name: Differential suite (native backend, then forced fallback)
        # The script pip-installs the pinned pypdf oracle OUTSIDE the pixi
        # env (pixi.toml is shared repo infrastructure and stays untouched).
        run: |
          PYTHONPATH=python/pypdf_filters_mojo PYTHONNOUSERSITE=1 \
            pixi run bash scripts/test_all_pypdf_filters.sh

      - name: Build + repair the platform wheel (delocate/auditwheel)
        run: pixi run bash python/pypdf_filters_mojo/build_wheel.sh

      - name: Smoke-test the wheel in a clean venv
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/pypdf-filters-wheel-smoke
          /tmp/pypdf-filters-wheel-smoke/bin/pip install --quiet python/pypdf_filters_mojo/dist/*.whl
          # Hide the pixi env for the smoke: an end user has no Mojo toolchain,
          # so the wheel must load its kernel purely from its own vendored
          # libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          cd /tmp
          # quickstart lives under examples/ so its directory contains no
          # pdf_mojo/ package: sys.path[0] cannot shadow the installed wheel.
          /tmp/pypdf-filters-wheel-smoke/bin/python "$repo_root/python/pypdf_filters_mojo/examples/quickstart.py" | tee /tmp/quickstart-native.txt
          # The forced fallback must produce identical output.
          PDF_MOJO_DISABLE_NATIVE=1 /tmp/pypdf-filters-wheel-smoke/bin/python "$repo_root/python/pypdf_filters_mojo/examples/quickstart.py" | tee /tmp/quickstart-fallback.txt
          /tmp/pypdf-filters-wheel-smoke/bin/python - <<'EOF'
          import pdf_mojo

          info = pdf_mojo.backend_info()
          assert info["native_available"], f"wheel must carry the native kernel: {info}"

          native = open("/tmp/quickstart-native.txt").read()
          fallback = open("/tmp/quickstart-fallback.txt").read()
          strip = lambda t: "\n".join(l for l in t.splitlines() if not l.startswith("pypdf-filters-mojo"))
          assert strip(native) == strip(fallback), (native, fallback)
          print("wheel smoke OK:", pdf_mojo.__version__, info["native_source"])
          EOF

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypdf-filters-mojo-wheel-${{ matrix.os }}
          path: python/pypdf_filters_mojo/dist/*.whl
          retention-days: 14
