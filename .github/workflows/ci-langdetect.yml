name: ci-langdetect

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

jobs:
  test:
    name: langdetect-mojo differential tests + wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        shell: bash
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Build the langdetect Mojo kernel
        run: pixi run bash kernels/langdetect/build.sh

      - name: Differential suite (native backend, then forced fallback)
        # The runner script provisions the PyPI oracle (langdetect==1.0.9)
        # itself, in the pixi env when possible else in a dedicated venv.
        run: pixi run bash scripts/test_all_langdetect.sh

      - name: Build + repair the platform wheel (delocate/auditwheel)
        run: pixi run bash python/langdetect_mojo/build_wheel.sh

      - name: Smoke-test the wheel in a clean venv
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/langdetect-wheel-smoke
          /tmp/langdetect-wheel-smoke/bin/pip install --quiet python/langdetect_mojo/dist/*.whl
          # Hide the pixi env for the smoke: an end user has no Mojo toolchain,
          # so the wheel must load its kernel purely from its own vendored
          # libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          cd /tmp
          # quickstart.py lives inside the package directory but is invoked by
          # path from /tmp, so sys.path[0] cannot shadow the installed wheel.
          /tmp/langdetect-wheel-smoke/bin/python "$repo_root/python/langdetect_mojo/quickstart.py" | tee /tmp/quickstart-native.txt
          # The forced fallback must produce the same results (the suite
          # asserts bit-exact parity; identical to all printed digits here).
          LANGDETECT_MOJO_DISABLE_NATIVE=1 /tmp/langdetect-wheel-smoke/bin/python "$repo_root/python/langdetect_mojo/quickstart.py" | tee /tmp/quickstart-fallback.txt
          /tmp/langdetect-wheel-smoke/bin/python - <<'EOF'
          import re

          import langdetect_mojo

          info = langdetect_mojo.backend_info()
          assert info["native_available"], f"wheel must carry the native kernel: {info}"

          def checksum(path):
              text = open(path).read()
              m = re.search(r"detection checksum: ([0-9.eE+-]+)", text)
              assert m, f"no checksum in {path}"
              return float(m.group(1))

          native = checksum("/tmp/quickstart-native.txt")
          fallback = checksum("/tmp/quickstart-fallback.txt")
          assert native == fallback, (native, fallback)
          print("wheel smoke OK:", langdetect_mojo.__version__, info["native_source"])
          EOF

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: langdetect-mojo-wheel-${{ matrix.os }}
          path: python/langdetect_mojo/dist/*.whl
          retention-days: 14
