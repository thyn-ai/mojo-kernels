name: ci-ase-neighborlist

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job: the workflow only builds, tests and uploads a
# build artifact (artifact upload needs no write scope).
permissions:
  contents: read

jobs:
  test:
    name: ase-mojo differential tests + wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          # Install the pixi binary only. The tasks below install the environment
          # lazily on first `pixi run`, exactly as the previous curl|bash step did;
          # `pixi install --locked` + caching is a separate, opt-in change.
          run-install: false

      - name: Build the ase-neighborlist Mojo kernel
        run: pixi run bash kernels/ase_neighborlist/build.sh

      - name: Differential suite (native backend, then forced fallback)
        # The ASE oracle (ase==3.26.0) comes from pixi.toml
        # [pypi-dependencies], pinned and lock-verified.
        run: pixi run bash scripts/test_all_ase_neighborlist.sh

      - name: Build + repair the platform wheel (delocate/auditwheel)
        run: pixi run bash python/ase_mojo/build_wheel.sh

      - name: Smoke-test the wheel in a clean venv
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/ase-wheel-smoke
          /tmp/ase-wheel-smoke/bin/pip install --quiet python/ase_mojo/dist/*.whl
          # Hide the pixi env for the smoke: an end user has no Mojo toolchain,
          # so the wheel must load its kernel purely from its own vendored
          # libraries (not via the build machine's absolute rpath).
          repo_root="$PWD"
          mv .pixi .pixi-hidden
          trap 'mv "$repo_root/.pixi-hidden" "$repo_root/.pixi"' EXIT
          cd /tmp
          /tmp/ase-wheel-smoke/bin/python "$repo_root/python/ase_mojo/quickstart.py" | tee /tmp/quickstart-native.txt
          # The forced fallback must produce the same results.
          ASE_MOJO_DISABLE_NATIVE=1 /tmp/ase-wheel-smoke/bin/python "$repo_root/python/ase_mojo/quickstart.py" | tee /tmp/quickstart-fallback.txt
          /tmp/ase-wheel-smoke/bin/python - <<'EOF'
          import re

          import ase_mojo

          info = ase_mojo.backend_info()
          assert info["native_available"], f"wheel must carry the native kernel: {info}"

          def checksum(path):
              text = open(path).read()
              m = re.search(r"distance checksum: ([0-9.eE+-]+)", text)
              assert m, f"no checksum in {path}"
              return float(m.group(1))

          native = checksum("/tmp/quickstart-native.txt")
          fallback = checksum("/tmp/quickstart-fallback.txt")
          assert native == fallback, (native, fallback)
          print("wheel smoke OK:", ase_mojo.__version__, info["native_source"])
          EOF

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ase-mojo-wheel-${{ matrix.os }}
          path: python/ase_mojo/dist/*.whl
          retention-days: 14
