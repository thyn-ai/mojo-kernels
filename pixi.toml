# pixi workspace for thyn-ai/mojo-kernels.
#
# One reproducible toolchain for every kernel in this repo:
#   * the Mojo compiler, from Modular's stable conda channel (`max`)
#   * Python + numpy + pytest, for the wrapper, differential tests and benchmarks
#
# `pixi run build-kernel-bm25` compiles the BM25 kernel into a shared library.
# `pixi run test` runs the differential suite (native + forced fallback).

[workspace]
name = "mojo-kernels"
version = "0.1.0"
description = "Mojo kernel acceleration factory: prebuilt per-platform kernels with thin Python wrappers and pure-Python fallbacks."
authors = ["thyn-ai"]
license = "Apache-2.0"
channels = ["https://conda.modular.com/max", "https://prefix.dev/conda-forge"]
# Platforms with a working Mojo toolchain: macOS Apple Silicon and Linux x86_64.
# There is no Windows Mojo path today, so Windows consumers get the pure-Python
# fallback from the wrapper package. The macos/glibc pins are the floor for
# PyPI wheel-tag resolution.
platforms = [
  { platform = "osx-arm64", macos = "14.0" },
  { platform = "linux-64", glibc = "2.35" },
]

[dependencies]
# Mojo ships as part of MAX; max-core pins the mojo-compiler package.
max = "26.6.*"
python = "3.12.*"

[target.linux-64.dependencies]
# Native library repair for the fuse-mojo npm platform package on Linux
# (rpath rewrite to $ORIGIN after vendoring the Mojo runtime; delocate
# covers the same step on macOS).
patchelf = ">=0.17"

[pypi-dependencies]
numpy = ">=1.26,<3"
# Test/benchmark oracle only: the differential suite compares bm25_mojo against
# the reference rank_bm25 package element-wise. Not a runtime dependency of the
# published wrapper. Pinned: the oracle must be the published PyPI release.
rank_bm25 = "==0.2.2"
# Test/benchmark oracles for cclib-mojo only: cclib's volume functions run
# against our integration helpers, and pyquante2 (the pip-installable
# PyQuante successor) is an independent Gaussian-amplitude oracle. Neither
# is a runtime dependency of the published wrapper. Pinned like rank_bm25.
cclib = "==1.8.1"
pyquante2 = "==0.2.0"
pytest = ">=8"
build = ">=1"
hatchling = ">=1.21"
# Wheel repair: vendor the Mojo runtime shared libraries into the wheel and
# rewrite the kernel library's load paths to be wheel-relative, so installed
# wheels are self-contained on end-user machines (no pixi env required).
delocate = ">=0.10"
auditwheel = ">=6"

[tasks]
# Compile the BM25 kernel into a shared library under kernels/bm25/build/.
build-kernel-bm25 = "bash kernels/bm25/build.sh"
# Differential suite: native path, then again with the fallback forced on.
# PYTHONPATH makes the in-repo wrapper importable; PYTHONNOUSERSITE keeps
# stray user site-packages out of the toolchain.
test = { cmd = "bash scripts/test_all.sh", env = { PYTHONPATH = "python/bm25_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-bm25"] }
test-native = { cmd = "pytest tests/test_differential.py tests/test_loader.py -q", env = { PYTHONPATH = "python/bm25_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-bm25"] }
test-fallback = { cmd = "pytest tests/test_differential.py tests/test_loader.py -q", env = { PYTHONPATH = "python/bm25_mojo", PYTHONNOUSERSITE = "1", BM25_MOJO_DISABLE_NATIVE = "1" } }
# Reproducible benchmark: rank_bm25 vs bm25_mojo (median of 5 runs).
bench = { cmd = "python benchmarks/bench_bm25.py", env = { PYTHONPATH = "python/bm25_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-bm25"] }
# Build the platform wheel for bm25_mojo (wheel-only; no sdist).
wheel-bm25 = { cmd = "bash python/bm25_mojo/build_wheel.sh", env = { PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-bm25"] }

# --- cclib-mojo (academic flagship) ---
# Compile the gaussgrid kernel into a shared library under kernels/gaussgrid/build/.
build-kernel-gaussgrid = "bash kernels/gaussgrid/build.sh"
# cclib-mojo differential suite: native path, then forced fallback.
test-cclib = { cmd = "bash scripts/test_all_cclib.sh", env = { PYTHONPATH = "python/cclib_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-gaussgrid"] }
test-cclib-native = { cmd = "pytest tests/test_gaussgrid_differential.py tests/test_gaussgrid_loader.py -q", env = { PYTHONPATH = "python/cclib_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-gaussgrid"] }
test-cclib-fallback = { cmd = "pytest tests/test_gaussgrid_differential.py tests/test_gaussgrid_loader.py -q", env = { PYTHONPATH = "python/cclib_mojo", PYTHONNOUSERSITE = "1", CCLIB_MOJO_DISABLE_NATIVE = "1" } }
# Reproducible benchmark: PyQuante1-path vs cclib_mojo (median of 5 runs).
bench-cclib = { cmd = "python benchmarks/bench_gaussgrid.py", env = { PYTHONPATH = "python/cclib_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-gaussgrid"] }
# Build the platform wheel for cclib_mojo (wheel-only; no sdist).
wheel-cclib = { cmd = "bash python/cclib_mojo/build_wheel.sh", env = { PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-gaussgrid"] }

# --- fuse-mojo (TypeScript flagship) ---
# Compile the Fuse Bitap kernel + pthread shim under kernels/fuse/build/.
build-kernel-fuse = "bash kernels/fuse/build.sh"
# Differential suite vs published Fuse.js: native backend, then forced fallback.
# Node.js/npm come from the host (CI uses setup-node), not from pixi.
test-fuse = { cmd = "bash typescript/fuse-mojo/scripts/test_all.sh", depends-on = ["build-kernel-fuse"] }
# Reproducible benchmark: Fuse.js vs fuse-mojo native (median of 5 runs).
bench-fuse = { cmd = "node benchmarks/bench_fuse.mjs", depends-on = ["build-kernel-fuse"] }
# Pack the npm platform package and repair the native libraries
# (delocate on macOS / patchelf on Linux) so no build-machine paths remain.
pack-fuse = { cmd = "bash typescript/fuse-mojo/scripts/pack-platform.sh", depends-on = ["build-kernel-fuse"] }
# End-user bar: fresh npm project from packed tarballs, README quick-start,
# native backend and simulated-Windows fallback with identical output.
smoke-fuse = { cmd = "bash typescript/fuse-mojo/scripts/smoke.sh", depends-on = ["pack-fuse"] }
