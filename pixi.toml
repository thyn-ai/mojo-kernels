# pixi workspace for thyn-ai/mojo-kernels.
#
# One reproducible toolchain for every kernel in this repo:
#   * the Mojo compiler, from Modular's stable conda channel (`max`)
#   * Python + numpy + pytest, for the wrapper, differential tests and benchmarks
#
# `pixi run build-kernel-bm25` compiles the BM25 kernel into a shared library.
# `pixi run test` runs the differential suite (native + forced fallback).
# `pixi run fuzz-regression` replays the fuzzing seed corpora; the `fuzz`
# environment adds atheris for coverage-guided runs (Linux x86_64 only).

[workspace]
name = "mojo-kernels"
version = "0.1.2"
description = "Mojo kernel acceleration factory: prebuilt per-platform kernels with thin Python wrappers and pure-Python fallbacks."
authors = ["thyn-ai"]
license = "Apache-2.0"
channels = ["https://conda.modular.com/max", "https://prefix.dev/conda-forge"]
# Platforms with a working Mojo toolchain: macOS Apple Silicon and Linux x86_64.
# There is no Windows Mojo path today, so Windows consumers get the pure-Python
# fallback from the wrapper package. The macos/glibc pins are the floor for
# PyPI wheel-tag resolution.
platforms = [
  { platform = "osx-arm64", macos = "14.0" },
  { platform = "linux-64", glibc = "2.35" },
]

[dependencies]
# Mojo ships as part of MAX; max-core pins the mojo-compiler package.
max = "26.6.*"
python = "3.12.*"
# pip is what a few kernel CI workflows and scripts/test_all_*.sh (langdetect,
# metpy, ta) still use to provision their pinned, test-only oracle packages
# into a --target directory (`pixi run python -m pip install --target ...
# "<oracle>==<pin>"`); the oracles listed under [pypi-dependencies] below come
# from the lock instead. The published wrappers never depend on it.
pip = ">=25"

[target.osx-arm64.dependencies]
# One OpenMP runtime per process. conda-forge's default OpenBLAS on osx-arm64
# is the OpenMP build, which loads the environment's libomp.dylib as soon as
# numpy is imported. Several pip-installed test oracles ship their own copy of
# LLVM's OpenMP runtime inside the wheel (elephant's `fim` mining extension
# does, via delocate), and LLVM's libomp aborts the whole process the moment a
# second copy initialises ("OMP: Error #15"). The pthreads build of the same
# OpenBLAS keeps the environment free of OpenMP, so an oracle's vendored
# runtime is the only one in the process. Linux is unaffected: manylinux
# wheels vendor GCC's libgomp, which coexists with libomp.
libopenblas = { version = "*", build = "pthreads*" }

[target.linux-64.dependencies]
# Native library repair for the fuse-mojo npm platform package on Linux
# (rpath rewrite to $ORIGIN after vendoring the Mojo runtime; delocate
# covers the same step on macOS).
patchelf = ">=0.17"

[pypi-dependencies]
numpy = ">=1.26,<3"
# Test/benchmark oracle only: the differential suite compares bm25_mojo against
# the reference rank_bm25 package element-wise. Not a runtime dependency of the
# published wrapper. Pinned: the oracle must be the published PyPI release.
rank_bm25 = "==0.2.2"
# Test/benchmark oracles for cclib-mojo only: cclib's volume functions run
# against our integration helpers, and pyquante2 (the pip-installable
# PyQuante successor) is an independent Gaussian-amplitude oracle. Neither
# is a runtime dependency of the published wrapper. Pinned like rank_bm25.
cclib = "==1.8.1"
pyquante2 = "==0.2.0"
# Test oracles for the other per-kernel differential suites, one published
# PyPI release each, pinned to the version the kernel's parity claim was
# measured against. None is a runtime dependency of any published wrapper.
# They live here rather than in ad-hoc `pip install` steps so that the lock
# file is the single source of truth for what the suites run against (and
# because a pixi re-solve prunes anything pip put in site-packages).
ase = "==3.26.0"          # ase-mojo (kernels/ase_neighborlist); pulls scipy + matplotlib
croniter = "==6.2.4"      # croniter-mojo
networkx = "==3.5"        # nx-mojo (kernels/networkx-graph)
pykalman = "==0.11.2"     # pykalman-mojo
pypdf = "==6.19.0"        # pypdf-filters-mojo (pdf_mojo)
sacrebleu = "==2.5.1"     # sacrebleu-mojo
uproot = "==5.7.6"        # uproot-mojo (kernels/uproot-branches)
awkward = "==2.14.0"      # uproot-mojo: the uproot oracle reads arrays through awkward
cramjam = "==2.12.1"      # uproot-mojo: the wrapper's own runtime dependency (pyproject.toml)
dynesty = "==3.1.0"       # dynesty-mojo
elephant = "==1.2.1"      # elephant-mojo (kernels/elephant-surrogates); pulls neo + quantities
jmespath = "==1.0.1"      # jmespath-mojo
jsonpath-ng = "==1.7.0"   # jsonpath-mojo
jsonschema = "==4.26.0"   # jsonschema-mojo
ruptures = "==1.1.10"     # ruptures-mojo
# Benchmark-only incumbent oracle for benchmarks/bench_bm25s.py (not a test
# oracle: bm25s floors idf differently by design, so it is not element-wise
# comparable). Pinned like the other oracles.
bm25s = "==0.3.11"
numba = "==0.67.0"
pytest = ">=8"
build = ">=1"
hatchling = ">=1.21"
# Wheel repair: vendor the Mojo runtime shared libraries into the wheel and
# rewrite the kernel library's load paths to be wheel-relative, so installed
# wheels are self-contained on end-user machines (no pixi env required).
delocate = ">=0.10"
auditwheel = ">=6"

[tasks]
# Compile the BM25 kernel into a shared library under kernels/bm25/build/.
build-kernel-bm25 = "bash kernels/bm25/build.sh"
# Differential suite: native path, then again with the fallback forced on.
# PYTHONPATH makes the in-repo wrapper importable; PYTHONNOUSERSITE keeps
# stray user site-packages out of the toolchain.
test = { cmd = "bash scripts/test_all.sh", env = { PYTHONPATH = "python/bm25_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-bm25"] }
test-native = { cmd = "pytest tests/test_differential.py tests/test_loader.py tests/test_fuzz_regression_bm25.py -q", env = { PYTHONPATH = "python/bm25_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-bm25"] }
test-fallback = { cmd = "pytest tests/test_differential.py tests/test_loader.py tests/test_fuzz_regression_bm25.py -q", env = { PYTHONPATH = "python/bm25_mojo", PYTHONNOUSERSITE = "1", BM25_MOJO_DISABLE_NATIVE = "1" } }
# Reproducible benchmark: rank_bm25 vs bm25_mojo (median of 5 runs).
bench = { cmd = "python benchmarks/bench_bm25.py", env = { PYTHONPATH = "python/bm25_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-bm25"] }
# Build the platform wheel for bm25_mojo (wheel-only; no sdist).
wheel-bm25 = { cmd = "bash python/bm25_mojo/build_wheel.sh", env = { PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-bm25"] }

# --- cclib-mojo (academic flagship) ---
# Compile the gaussgrid kernel into a shared library under kernels/gaussgrid/build/.
build-kernel-gaussgrid = "bash kernels/gaussgrid/build.sh"
# cclib-mojo differential suite: native path, then forced fallback.
test-cclib = { cmd = "bash scripts/test_all_cclib.sh", env = { PYTHONPATH = "python/cclib_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-gaussgrid"] }
test-cclib-native = { cmd = "pytest tests/test_gaussgrid_differential.py tests/test_gaussgrid_loader.py tests/test_fuzz_regression_cclib.py -q", env = { PYTHONPATH = "python/cclib_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-gaussgrid"] }
test-cclib-fallback = { cmd = "pytest tests/test_gaussgrid_differential.py tests/test_gaussgrid_loader.py tests/test_fuzz_regression_cclib.py -q", env = { PYTHONPATH = "python/cclib_mojo", PYTHONNOUSERSITE = "1", CCLIB_MOJO_DISABLE_NATIVE = "1" } }
# Reproducible benchmark: PyQuante1-path vs cclib_mojo (median of 5 runs).
bench-cclib = { cmd = "python benchmarks/bench_gaussgrid.py", env = { PYTHONPATH = "python/cclib_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-gaussgrid"] }
# Build the platform wheel for cclib_mojo (wheel-only; no sdist).
wheel-cclib = { cmd = "bash python/cclib_mojo/build_wheel.sh", env = { PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-gaussgrid"] }

# --- fuse-mojo (TypeScript flagship) ---
# Compile the Fuse Bitap kernel + pthread shim under kernels/fuse/build/.
build-kernel-fuse = "bash kernels/fuse/build.sh"
# Differential suite vs published Fuse.js: native backend, then forced fallback.
# Node.js/npm come from the host (CI uses setup-node), not from pixi.
test-fuse = { cmd = "bash typescript/fuse-mojo/scripts/test_all.sh", depends-on = ["build-kernel-fuse"] }
# Reproducible benchmark: Fuse.js vs fuse-mojo native (median of 5 runs).
bench-fuse = { cmd = "node benchmarks/bench_fuse.mjs", depends-on = ["build-kernel-fuse"] }
# Pack the npm platform package and repair the native libraries
# (delocate on macOS / patchelf on Linux) so no build-machine paths remain.
pack-fuse = { cmd = "bash typescript/fuse-mojo/scripts/pack-platform.sh", depends-on = ["build-kernel-fuse"] }
# End-user bar: fresh npm project from packed tarballs, README quick-start,
# native backend and simulated-Windows fallback with identical output.
smoke-fuse = { cmd = "bash typescript/fuse-mojo/scripts/smoke.sh", depends-on = ["pack-fuse"] }

# --- fuzzing (fuzz/, .github/workflows/fuzz.yml) ---
# Replay the checked-in seed corpora through the two differential harnesses.
# Needs no fuzzer: this is the mode the normal test suites run too
# (tests/test_fuzz_regression_*.py), so it works on every pixi platform.
fuzz-regression = { depends-on = ["fuzz-regression-bm25", "fuzz-regression-cclib"] }
fuzz-regression-bm25 = { cmd = "python fuzz/fuzz_bm25.py --regression", env = { PYTHONPATH = "python/bm25_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-bm25"] }
fuzz-regression-cclib = { cmd = "python fuzz/fuzz_cclib.py --regression", env = { PYTHONPATH = "python/cclib_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-gaussgrid"] }
# fast-check parity properties for fuse-mojo, native backend then forced
# fallback. FC_NUM_RUNS scales the budget (default 200; the nightly run uses
# more), FC_SEED replays a reported counterexample.
fuzz-fuse = { cmd = "bash typescript/fuse-mojo/scripts/test_property.sh", depends-on = ["build-kernel-fuse"] }

# Coverage-guided fuzzing needs atheris (Google's libFuzzer binding for
# Python), which publishes manylinux x86_64 wheels only; building it from
# source needs a libFuzzer-capable clang, which Apple's toolchain does not
# ship. The `fuzz` environment therefore exists for linux-64 CI runners and
# Linux developer machines; everywhere else `pixi run fuzz-regression`
# replays the same harnesses over the seed corpora.
[feature.fuzz.target.linux-64.pypi-dependencies]
atheris = "==3.1.0"

[feature.fuzz.tasks]
# libFuzzer flags pass straight through, e.g.
#   pixi run -e fuzz fuzz-bm25 -- -max_total_time=60
# New inputs and crash artifacts land under .fuzz-work/ (git-ignored); the
# checked-in seeds under fuzz/corpus/ are read but never written.
fuzz-bm25 = { cmd = "mkdir -p .fuzz-work/bm25 && python fuzz/fuzz_bm25.py -artifact_prefix=.fuzz-work/ .fuzz-work/bm25 fuzz/corpus/bm25", env = { PYTHONPATH = "python/bm25_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-bm25"] }
fuzz-cclib = { cmd = "mkdir -p .fuzz-work/cclib && python fuzz/fuzz_cclib.py -artifact_prefix=.fuzz-work/ .fuzz-work/cclib fuzz/corpus/cclib", env = { PYTHONPATH = "python/cclib_mojo", PYTHONNOUSERSITE = "1" }, depends-on = ["build-kernel-gaussgrid"] }

[environments]
fuzz = { features = ["fuzz"], solve-group = "default" }
