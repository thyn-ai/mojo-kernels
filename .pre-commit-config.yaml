# pre-commit configuration -- install once per clone:
#   uv tool install pre-commit   (or: pipx install pre-commit)
#   pre-commit install            # installs BOTH the pre-commit and pre-push hooks below
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^(charts?|helm|infra/helm)/
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # thyn-security-toolchain:begin -- managed by thyn-ai/security-toolchain (propagate). Edit args, not rev.
  - repo: https://github.com/thyn-ai/security-toolchain
    rev: v0.1.10
    hooks:
      - id: gitleaks-staged
      - id: opengrep-changed
        args: ["--overlay=pnpm-monorepo"]
      - id: actionlint
      - id: verify-toolchain
      - id: gitleaks-push
      - id: opengrep-full
        args: ["--overlay=pnpm-monorepo"]
      - id: osv-scan
      - id: trivy-config
      - id: security-fix-deps
  # thyn-security-toolchain:end
