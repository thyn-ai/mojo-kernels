[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatialmath-mojo"
version = "0.1.2"
description = "Fast batched SE(3)/SO(3) pose algebra (compose, inverse, point transforms) matching spatialmath-python, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["robotics", "spatial-math", "SE3", "SO3", "pose", "homogeneous-transformation", "mojo"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
# Poses are accepted and returned as np.ndarray, so numpy is the only hard
# dependency — spatialmath-python itself is optional (it is the test oracle).
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["spatialmath_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
