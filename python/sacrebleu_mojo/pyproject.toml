[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sacrebleu-mojo"
version = "0.1.2"
description = "Drop-in faster replacement for sacrebleu's BLEU and chrF corpus metrics, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["bleu", "chrf", "sacrebleu", "mt", "evaluation", "metrics", "mojo"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["sacrebleu_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
