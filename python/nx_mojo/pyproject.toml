[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nx-mojo"
version = "0.1.5"
description = "Mojo-accelerated networkx: betweenness_centrality and single_source_dijkstra with networkx-identical results (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["networkx", "graph", "betweenness-centrality", "dijkstra", "shortest-path", "mojo"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
# The API consumes networkx graphs and raises networkx exceptions, so
# networkx is a genuine runtime dependency (same role numpy plays for
# rank_bm25 in bm25-mojo). numpy backs the native buffer plumbing.
dependencies = ["numpy>=1.21", "networkx>=3.3"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Official out-of-tree networkx backend registration. Inert metadata unless
# networkx looks it up (explicit backend="nx_mojo" or NETWORKX_BACKEND_PRIORITY);
# see the README for the dispatch quickstart.
[project.entry-points."networkx.backends"]
nx_mojo = "nx_mojo.backend:BackendInterface"

[project.entry-points."networkx.backend_info"]
nx_mojo = "nx_mojo.backend:get_info"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["nx_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
