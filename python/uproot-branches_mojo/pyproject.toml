[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uproot-mojo"
version = "0.1.2"
description = "Fast ROOT TBranch reading for vector<T> and string branches, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["root", "uproot", "hep", "tbranch", "ttree", "mojo", "particle-physics"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
# numpy for the returned buffers; cramjam for zlib basket decompression.
# uproot/awkward are NOT runtime dependencies (they are the differential
# test oracle only).
dependencies = ["numpy>=1.21", "cramjam>=2.7"]

[project.optional-dependencies]
awkward = ["awkward>=2"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["uproot_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
