[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ta-mojo"
version = "0.1.3"
description = "Fast technical-analysis indicators (EMA, RSI, ATR, MACD) matching pandas-ta-classic, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["technical-analysis", "indicators", "ema", "rsi", "atr", "macd", "mojo", "trading"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
# Indicators are computed and returned as np.ndarray; nothing else is needed.
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["ta_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
