[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toml-mojo"
version = "0.1.2"
description = "Drop-in faster replacement for stdlib tomllib, powered by a Mojo kernel (tomllib fallback included)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["toml", "parser", "config", "mojo", "tomllib", "tomlkit"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]
# No runtime dependencies: the fallback parser is stdlib tomllib (3.11+).
dependencies = []

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["toml_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
