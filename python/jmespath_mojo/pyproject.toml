[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jmespath-mojo"
version = "0.1.1"
description = "Drop-in faster replacement for jmespath, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["jmespath", "json", "query", "mojo", "aws"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# Pure stdlib: the wrapper needs nothing beyond Python itself.
dependencies = []

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["jmespath_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
