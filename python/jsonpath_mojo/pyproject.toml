[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsonpath-mojo"
version = "0.1.0"
description = "Fast JSONPath queries (jsonpath-ng ext dialect), powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["jsonpath", "jsonpath-ng", "json", "query", "mojo"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# No runtime dependencies: the native kernel ships inside the wheel and the
# fallback is vendored pure Python.
dependencies = []

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["jsonpath_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
