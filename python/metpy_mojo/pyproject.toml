[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metpy-mojo"
version = "0.1.5"
description = "Fast MetPy-compatible parcel CAPE/CIN for standard atmospheric soundings, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["metpy", "meteorology", "cape", "cin", "sounding", "atmospheric-science", "mojo", "weather"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# Arrays in/out are np.ndarray, so numpy is the only hard dependency —
# metpy itself is optional (it is the test oracle, not a runtime dep).
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["metpy_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
