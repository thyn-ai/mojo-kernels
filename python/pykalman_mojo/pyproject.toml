[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pykalman-mojo"
version = "0.1.3"
description = "Drop-in faster Kalman filter/smoother for pykalman workloads, powered by a Mojo kernel (pure-NumPy fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["kalman", "kalman-filter", "kalman-smoother", "state-space", "mojo", "time-series"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
# State means/covariances are returned as np.ndarray; numpy is the only
# runtime dependency (the fallback's pseudo-inverse is np.linalg.pinv).
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["pykalman_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
