[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypdf-filters-mojo"
version = "0.1.3"
description = "Mojo-accelerated PNG-predictor and LZW decoders for PDF streams, byte-compatible with pypdf (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["pypdf", "pdf", "png-predictor", "lzw", "mojo", "flate", "decode"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: File Formats",
]
# Zero runtime dependencies: bytes in, bytes out. pypdf is only the
# differential-test oracle, never a dependency of this package.
dependencies = []

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["pdf_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
