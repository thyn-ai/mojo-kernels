[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obspy-mojo"
version = "0.1.2"
description = "Drop-in faster Konno-Ohmachi smoothing for ObsPy users, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["obspy", "seismology", "konno-ohmachi", "smoothing", "mojo", "spectra"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
# Same hard dependency as obspy's smoothing itself: spectra are np.ndarray.
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["obspy_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
