[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynesty-mojo"
version = "0.1.2"
description = "Nested sampling with a Mojo bounding/proposal kernel and a dynesty-shaped API (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["nested-sampling", "bayesian-inference", "evidence", "mojo", "mcmc"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
# Samples and weights are returned as np.ndarray; numpy is the only hard
# dependency. dynesty itself is NOT a dependency (test/benchmark oracle only).
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["dynesty_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
