[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bm25-mojo"
version = "0.1.0"
description = "Drop-in faster replacement for rank_bm25, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["bm25", "search", "ranking", "mojo", "information-retrieval"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
]
# Same hard dependency as rank_bm25 itself: scores are returned as np.ndarray.
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["bm25_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
