[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vader-mojo"
version = "0.1.5"
description = "Drop-in faster replacement for vaderSentiment, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["vader", "sentiment", "sentiment-analysis", "mojo", "nlp"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
# Zero runtime dependencies: the package is ctypes + vendored data only.
dependencies = []

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["vader_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
