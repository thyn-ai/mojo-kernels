[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oletools-mojo"
version = "0.1.4"
description = "Drop-in faster replacement for oletools' olevba.decompress_stream (MS-OVBA VBA decompression), powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["oletools", "olevba", "ms-ovba", "vba", "decompression", "mojo", "security", "malware-analysis"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: File Formats",
]
# Zero runtime dependencies: bytes in, bytes out. oletools is only the test
# oracle (and an optional, user-side integration target), never a dependency.
dependencies = []

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["oletools_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
