[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statistics-mojo"
version = "0.1.4"
description = "Drop-in faster replacement for the stdlib statistics module, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["statistics", "mean", "variance", "stdev", "quantiles", "median", "mojo", "stdlib"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
# NumPy is the only runtime dependency: it is the buffer format exchanged
# with the native kernel.
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["statistics_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
