[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "difflib-mojo"
version = "0.1.5"
description = "difflib.SequenceMatcher and get_close_matches, accelerated by a Mojo kernel (pure-Python fallback included; outputs identical to CPython 3.12 difflib)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["difflib", "sequence-matcher", "get-close-matches", "fuzzy-matching", "string-similarity", "diff", "mojo"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Topic :: Text Processing :: General",
]
# numpy is the only hard dependency (codepoint arrays shared with the kernel).
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["difflib_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
