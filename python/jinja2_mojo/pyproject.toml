[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jinja2-mojo"
version = "0.1.2"
description = "Faster jinja2 template compilation, powered by a Mojo lexer kernel (stock-jinja2 lexer fallback included; render output byte-identical)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["jinja2", "templates", "compile", "lexer", "mojo"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: HTML",
]
# The parser, compiler and render runtime are stock jinja2 — only the
# compile-time lexer is swapped for the native kernel (with automatic
# fallback to the stock lexer). Parity was measured against jinja2 3.1.6.
dependencies = ["jinja2>=3.1.6,<3.2"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["jinja2_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
