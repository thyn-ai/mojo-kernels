[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ase-mojo"
version = "0.1.2"
description = "Fast periodic neighbor lists with an ASE-compatible API, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["ase", "neighbor-list", "molecular-dynamics", "periodic-boundary-conditions", "cell-list", "mojo", "computational-chemistry", "materials"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
# Positions/cells are returned as np.ndarray, so numpy is the only hard
# dependency — ASE itself is optional (its Atoms objects are duck-typed).
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["ase_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
