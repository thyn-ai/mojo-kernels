[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slugify-mojo"
version = "0.1.3"
description = "Drop-in faster replacement for python-slugify, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["slugify", "slug", "transliteration", "unicode", "mojo", "cms"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Filters",
]
# The transliteration table is read at runtime from the installed
# text-unidecode package's own data file (never vendored), the same package
# python-slugify itself depends on.
dependencies = ["text-unidecode>=1.3"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["slugify_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
