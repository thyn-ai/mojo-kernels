[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mistune-mojo"
version = "0.1.3"
description = "Drop-in faster replacement for mistune.markdown, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["markdown", "commonmark", "mistune", "mojo", "html"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]
# Zero runtime dependencies: the native kernel and the pure-Python engine are
# both fully self-contained.
dependencies = []

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["mistune_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
