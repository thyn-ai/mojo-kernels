[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elephant-mojo"
version = "0.1.0"
description = "Fast SPADE surrogate dithering and p-value spectrum for elephant-style spike-train analysis, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["elephant", "spade", "spike-train", "surrogates", "dithering", "pvalue-spectrum", "neuroscience", "mojo"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Binned surrogates are returned as np.ndarray, so numpy is the only hard
# dependency — elephant itself is optional (it is the test oracle, never a
# runtime dependency).
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["elephant_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
