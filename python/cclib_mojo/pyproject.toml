[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cclib-mojo"
version = "0.1.2"
description = "Fast electron-density and wavefunction-on-grid evaluation for cclib-style basis sets, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["cclib", "computational-chemistry", "electron-density", "wavefunction", "gaussian-basis", "mojo", "cube-file"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
# Grids are returned as np.ndarray, so numpy is the only hard dependency —
# cclib itself is optional (integration helpers duck-type its objects).
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["cclib_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
