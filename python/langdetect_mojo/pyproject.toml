[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langdetect-mojo"
version = "0.1.5"
description = "Drop-in faster replacement for langdetect, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["language-detection", "langdetect", "ngrams", "mojo", "text-processing"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
# Runtime dependency: the 55-language profiles and normalization tables are
# read at runtime from the installed reference package (never re-derived).
dependencies = ["langdetect>=1.0.9,<2.0"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["langdetect_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
