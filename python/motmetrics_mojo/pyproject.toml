[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motmetrics-mojo"
version = "0.1.4"
description = "Fast MOTChallenge metrics (MOTA/MOTP/IDF1/MOSTLY_*), drop-in-shaped for motmetrics, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["motmetrics", "motchallenge", "mota", "motp", "idf1", "multiple-object-tracking", "mojo", "evaluation"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
# Scores come back as plain Python floats/ints; the only runtime dependency is
# NumPy (for the distance-matrix handling). Unlike the oracle, pandas is NOT
# required.
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["motmetrics_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
