[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capa-mojo"
version = "0.1.3"
description = "Accelerated rule-evaluation engine for capa-style rule sets, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["capa", "malware", "security", "reverse-engineering", "mojo", "rules"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
# numpy backs the flat block buffers passed to the native kernel; PyYAML
# parses the rule documents. Both are mature, minimal, and necessary.
dependencies = ["numpy>=1.21", "PyYAML>=5.4"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["capa_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
