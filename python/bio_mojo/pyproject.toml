[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bio-mojo"
version = "0.1.1"
description = "FASTA/GenBank parsers matching Bio.SeqIO byte-for-byte, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["fasta", "genbank", "bioinformatics", "parser", "mojo", "biopython"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# No runtime dependencies: the parser is self-contained (native kernel in the
# wheel, vendored pure-Python fallback). biopython is used only as the
# differential-test oracle, never at runtime.
dependencies = []

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["bio_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
