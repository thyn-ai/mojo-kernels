[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "croniter-mojo"
version = "0.1.2"
description = "Drop-in faster get_next/get_prev for 5-field cron expressions, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["cron", "croniter", "scheduler", "scheduling", "mojo", "datetime"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# Pure stdlib: datetimes, zoneinfo and ctypes only — zero runtime dependencies.
dependencies = []

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["croniter_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
