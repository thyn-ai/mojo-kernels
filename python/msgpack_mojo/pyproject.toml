[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msgpack-mojo"
version = "0.1.2"
description = "Drop-in faster replacement for msgpack packb/unpackb, powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["msgpack", "messagepack", "serialization", "binary", "mojo"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# No runtime dependencies: the package talks to its kernel over ctypes and
# carries a vendored pure-Python fallback engine.
dependencies = []

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["msgpack_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
