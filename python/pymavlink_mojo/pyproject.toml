[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymavlink-mojo"
version = "0.1.3"
description = "Batch MAVLink v1/v2 log decoding (tlog analysis), powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["mavlink", "pymavlink", "ardupilot", "tlog", "telemetry", "mojo", "drone"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
# numpy is the only hard dependency: the native backend uses it for
# zero-copy views over the kernel's result arenas.
dependencies = ["numpy>=1.21"]

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["pymavlink_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
