[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsonschema-mojo"
version = "0.1.2"
description = "Drop-in faster replacement for the jsonschema package (draft 2020-12 subset), powered by a Mojo kernel (pure-Python fallback included)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Algenta" }]
keywords = ["json", "jsonschema", "validation", "mojo", "draft-2020-12"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
# Zero runtime dependencies: the vendored pure-Python fallback keeps the
# package self-contained on platforms without a native kernel.
dependencies = []

[project.urls]
Repository = "https://github.com/thyn-ai/mojo-kernels"

# Wheels only: the shared library cannot rebuild from an sdist, so no sdist
# target is offered. Per-platform wheels are produced by CI.
[tool.hatch.build.targets.wheel]
packages = ["jsonschema_mojo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
